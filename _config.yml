title: Basis Pfadistufe 27
tagline: Arrr
description: A minimal, responsive and feature-rich Jekyll theme for technical writing.
baseurl: ''
url: https://basis-ps-27.aure2.ch
author: Region AZUR
social:
  name: Region AZUR
  links:
    - https://region-azur.ch
theme: jekyll-theme-chirpy
lang: en
timezone: Europe/Zurich
pwa:
  enabled: true
  cache:
    deny_paths: []
include:
  - _tabs
  - content
defaults:
  - scope:
      path: ''
    values:
      sitemap: false
  - scope:
      path: content
    values:
      layout: content_page
      toc: true
      panel_includes:
        - toc
      permalink: /:basename
collections:
  tabs:
    output: true
avatar: >-
  data:image/png;base64,
